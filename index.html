<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onla — The trip, before you take it.</title>
<meta name="description" content="Onla is a calm home for your travel — the plan, the tickets, the days themselves.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#46a4e1; --accent-strong:#2b76a8;
    --ink:#243a4d; --ink-muted:#5f7286;
    --surface:#f2f7fc; --raised:#ffffff; --hairline:#dee9f3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --accent:#58b1ea; --accent-strong:#58b1ea;
      --ink:#e8eff6; --ink-muted:#8fa2b6;
      --surface:#0f1822; --raised:#17222e; --hairline:#223140;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    font-family:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;
    background:var(--surface); color:var(--ink); padding:48px 24px;
  }
  .mark{
    width:64px;height:64px;border-radius:18px;margin-bottom:28px;
    background:linear-gradient(150deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 34px -14px color-mix(in srgb,var(--accent-strong) 65%,transparent);
  }
  .mark svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:clamp(34px,6vw,44px);font-weight:700;letter-spacing:-.025em;margin:0 0 10px}
  .tag{font-size:clamp(17px,2.6vw,20px);color:var(--ink-muted);font-weight:500;margin:0 0 40px}
  .links{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .links a{color:var(--accent-strong);text-decoration:none;font-weight:600;font-size:15px}
  .links a:hover{text-decoration:underline}
  footer{margin-top:56px;font-size:13px;color:var(--ink-muted)}
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
  </div>
  <h1>Onla</h1>
  <p class="tag">The trip, before you take it.</p>
  <nav class="links">
    <a href="/privacy/">Privacy</a>
    <a href="/support/">Support</a>
    <a href="mailto:feedback@onlatravel.com">feedback@onlatravel.com</a>
  </nav>
  <footer>© 2026 Onla · Your trips are yours.</footer>
</body>
</html>
